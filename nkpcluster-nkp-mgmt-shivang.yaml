apiVersion: clusters.nkp.nutanix.com/v1alpha1
kind: NKPCluster
metadata:
  annotations:
    preflight.cluster.caren.nutanix.com/skip: NutanixCredentials,NutanixPrismCentralVersion
  labels:
    cluster.x-k8s.io/provider: nutanix
    kommander.d2iq.io/host: "true"
    konvoy.d2iq.io/cluster-name: nkp-mgmt-shivang
    konvoy.d2iq.io/provider: nutanix
  name: nkp-mgmt-shivang
  namespace: kommander
spec:
  capiCluster:
    clusterNetwork:
      pods:
        cidrBlocks:
        - 192.168.0.0/16
      services:
        cidrBlocks:
        - 10.96.0.0/12
    topology:
      classRef:
        name: nkp-nutanix-v2.19.0
      controlPlane:
        replicas: 1
      variables:
      - name: clusterConfig
        value:
          addons:
            ccm:
              credentials:
                secretRef:
                  name: nkp-mgmt-shivang-pc-credentials-for-ccm
              strategy: HelmAddon
            clusterAutoscaler:
              strategy: HelmAddon
            cni:
              provider: Cilium
              strategy: HelmAddon
            cosi:
              strategy: HelmAddon
            csi:
              defaultStorage:
                provider: nutanix
                storageClassConfig: volume
              providers:
                nutanix:
                  credentials:
                    secretRef:
                      name: nkp-mgmt-shivang-pc-credentials-for-csi
                  storageClassConfigs:
                    volume:
                      allowExpansion: true
                      parameters:
                        csi.storage.k8s.io/fstype: ext4
                        description: CSI StorageClass nutanix-volume for nkp-mgmt-shivang
                        flashMode: DISABLED
                        hypervisorAttached: ENABLED
                        storageContainer: SelfServiceContainer
                        storageType: NutanixVolumes
                      reclaimPolicy: Delete
                      volumeBindingMode: WaitForFirstConsumer
                  strategy: HelmAddon
              snapshotController:
                strategy: HelmAddon
            konnectorAgent:
              credentials:
                secretRef:
                  name: nkp-mgmt-shivang-pc-credentials-for-konnector-agent
              enableKubeconfigUpload: true
            nfd:
              strategy: HelmAddon
            registry:
              provider: CNCF Distribution
            serviceLoadBalancer:
              configuration:
                addressRanges:
                - end: 10.161.64.62
                  start: 10.161.64.61
              provider: MetalLB
          controlPlane:
            autoRenewCertificates:
              daysBeforeExpiry: 180
            nodeRegistration:
              ignorePreflightErrors:
              - SystemVerification
            nutanix:
              machineDetails:
                bootType: uefi
                cluster:
                  name: Shivang-PROD
                  type: name
                image:
                  name: nkp-rocky-9.8-release-cis-1.36.2-20261014035643.qcow2
                  type: name
                memorySize: 8Gi
                project:
                  name: Shivang-Project-01
                  type: name
                subnets:
                - name: VLAN-254
                  type: name
                systemDiskSize: 90Gi
                vcpuSockets: 8
                vcpusPerSocket: 1
          dns:
            coreDNS: {}
          encryptionAtRest:
            providers:
            - secretbox: {}
          kubeProxy:
            mode: disabled
          nutanix:
            controlPlaneEndpoint:
              host: 10.161.64.60
              port: 6443
              virtualIP:
                provider: KubeVIP
            prismCentralEndpoint:
              credentials:
                secretRef:
                  name: nkp-mgmt-shivang-pc-credentials
              insecure: true
              url: https://10.161.18.26:9440
          users:
          - name: konvoy
            sshAuthorizedKeys:
            - |
              ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK/qu86dezdAjucBv8xb8sRAB8Opc/lIckNJnY6WsxMq
            sudo: ALL=(ALL) NOPASSWD:ALL
      version: v1.36.2
      workers:
        machineDeployments:
        - class: default-worker
          metadata:
            annotations:
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "2"
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "2"
          name: md-0
          variables:
            overrides:
            - name: workerConfig
              value:
                nodeRegistration:
                  ignorePreflightErrors:
                  - SystemVerification
                nutanix:
                  machineDetails:
                    bootType: uefi
                    cluster:
                      name: Shivang-PROD
                      type: name
                    image:
                      name: nkp-rocky-9.8-release-cis-1.36.2-20261014035643.qcow2
                      type: name
                    memorySize: 8Gi
                    project:
                      name: Shivang-Project-01
                      type: name
                    subnets:
                    - name: VLAN-254
                      type: name
                    systemDiskSize: 90Gi
                    vcpuSockets: 4
                    vcpusPerSocket: 1
  version: v2.19.0
